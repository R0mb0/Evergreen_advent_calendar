name: Build Jekyll & Deploy Evergreen Advent Calendar

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Permessi minimi a livello di workflow: ogni job aggiunge solo ciò che gli serve
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  SITE_DIR: docs

jobs:
  build:
    runs-on: ubuntu-latest
    # Serve per salvare il manifest aggiornato nel repository
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Genera days/manifest.json
        run: python3 .github/scripts/generate_manifest.py

      # Il file viene aggiornato anche nel repository, così resta allineato
      # con il sito pubblicato (e con il tuo clone locale dopo un git pull).
      # I push fatti con GITHUB_TOKEN non fanno ripartire il workflow.
      - name: Salva il manifest nel repository (solo se cambiato)
        run: |
          if [ -z "$(git status --porcelain -- "$SITE_DIR/days/manifest.json")" ]; then
            echo "Manifest già aggiornato, nessun commit necessario."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$SITE_DIR/days/manifest.json"
            git commit -m "chore: aggiorna days/manifest.json [skip ci]"
            git push || echo "::warning::Push del manifest non riuscito (branch protetto?). Il sito pubblicato è comunque aggiornato."
          fi

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build con Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Carica artefatto Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
