name: Build Jekyll & Deploy Evergreen Advent Calendar

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Minimal permissions at workflow level: each job adds only what it needs
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  SITE_DIR: docs

jobs:
  build:
    runs-on: ubuntu-latest
    # Needed to save the updated manifest into the repository
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate days/manifest.json
        run: python3 .github/scripts/generate_manifest.py

      # The file is also updated in the repository, so it stays aligned
      # with the published site (and with your local clone after a git pull).
      # Pushes made with GITHUB_TOKEN do not trigger the workflow again.
      - name: Save the manifest in the repository (only if changed)
        run: |
          if [ -z "$(git status --porcelain -- "$SITE_DIR/days/manifest.json")" ]; then
            echo "Manifest already up to date, no commit needed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$SITE_DIR/days/manifest.json"
            git commit -m "chore: update days/manifest.json [skip ci]"
            git push || echo "::warning::Manifest push failed (protected branch?). The published site is still up to date."
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
