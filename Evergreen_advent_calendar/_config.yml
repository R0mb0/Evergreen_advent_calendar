title: Evergreen Advent Calendar
baseurl: ""

# Jekyll only publishes the folder as-is: the app is plain HTML/CSS/JS.
# Folders and files starting with "_" or "." are ignored by Jekyll,
# so do not use such names inside days/.
include:
  - days
  - libs

# Repository files that must not end up in the published site
# (keep this list when the site is moved to the repository root).
exclude:
  - README.md
  - Readme_imgs
  - tools
  - LICENSE
  - Gemfile
  - Gemfile.lock
