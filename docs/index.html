<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ff5d7d" />
  <title>Evergreen Advent Calendar</title>

  <!-- =========================================================
       FONTS & LIBRARIES
       Everything is served from ./libs/ so the app works fully offline.
       Run tools/download_libs.py once to fill that folder (the GitHub workflow
       also does it automatically). If a file is missing, a public CDN is used
       as a fallback: libraries are handled by js/libs.js, fonts below.
       ========================================================= -->
  <link
    rel="stylesheet"
    href="libs/fonts/fonts.css"
    onerror="this.onerror=null;this.href='https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@500;600;700;800&amp;display=swap'"
  />

  <!-- Application styles -->
  <link rel="stylesheet" href="css/style.css" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Advent" />

  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
</head>
<body>
  <!-- Animated snow background -->
  <canvas id="snow-canvas" aria-hidden="true"></canvas>

  <!-- Floating toolbar -->
  <header class="toolbar-wrapper">
    <nav class="toolbar" aria-label="Barra degli strumenti">
      <div class="toolbar-brand">
        <div class="brand-badge" aria-hidden="true">
          <i data-lucide="gift"></i>
        </div>
        <div class="brand-text">
          <span id="toolbar-title" class="brand-title">Calendario</span>
          <span id="date-pill" class="date-pill" title="">
            <span id="time-source-dot" class="status-dot" aria-hidden="true"></span>
            <span id="date-pill-text">...</span>
          </span>
        </div>
      </div>

      <div class="toolbar-actions">
        <!-- Snow toggle -->
        <button id="btn-snow" class="icon-btn" type="button" title="Attiva o disattiva neve" aria-label="Attiva o disattiva neve">
          <i data-lucide="snowflake"></i>
        </button>

        <!-- Language picker with dropdown menu -->
        <div class="lang-picker">
          <button
            id="btn-lang"
            class="icon-btn"
            type="button"
            aria-haspopup="menu"
            aria-expanded="false"
            aria-controls="lang-menu"
          >
            <i data-lucide="globe"></i>
            <span id="lang-code-label" class="btn-label-sm">IT</span>
          </button>

          <div id="lang-menu" class="lang-menu" role="menu" hidden></div>
        </div>

        <!-- PWA install -->
        <button id="btn-install" class="icon-btn icon-btn--accent" type="button">
          <i data-lucide="download"></i>
          <span id="btn-install-label" class="btn-label-desktop">Installa</span>
        </button>
      </div>
    </nav>
  </header>

  <!-- Main content -->
  <main class="container">
    <section class="hero">
      <div class="hero-pill">
        <i data-lucide="sparkles"></i>
        <span id="progress-text">0 / 24</span>
      </div>
      <h1 id="hero-title" class="hero-title">Calendario</h1>
      <p id="hero-subtitle" class="hero-subtitle"></p>

      <!-- Banner shown automatically outside the target month -->
      <div id="off-month-banner" class="info-banner" hidden>
        <i data-lucide="calendar-clock"></i>
        <span id="off-month-text"></span>
      </div>

      <!-- Demo bar to test dates, months and multi-year reopening (enabled via config.json) -->
      <div id="demo-controls" class="demo-bar" hidden>
        <span id="demo-tag-label" class="demo-tag">Anteprima Dev</span>

        <label class="demo-field">
          <span id="demo-year-label">Anno</span>
          <select id="demo-year-select"></select>
        </label>

        <label class="demo-field">
          <span id="demo-month-label">Mese</span>
          <select id="demo-month-select">
            <option value="11">11</option>
            <option value="12" selected>12</option>
            <option value="1">1</option>
          </select>
        </label>

        <label class="demo-field" for="demo-day-slider">
          <span id="demo-day-label">Giorno</span>: <strong id="demo-day-value">5</strong>
          <input id="demo-day-slider" type="range" min="1" max="25" value="5" />
        </label>

        <button id="btn-reset-demo" class="mini-btn" type="button">
          <i data-lucide="rotate-ccw"></i>
          <span id="demo-reset-label">Reset</span>
        </button>
      </div>
    </section>

    <!-- 3D grid of doors -->
    <section id="calendar-grid" class="calendar-grid" aria-label="Caselle del calendario"></section>
  </main>

  <!-- Content modal -->
  <div id="day-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <div class="modal-card modal-card--wide">
      <div class="modal-header">
        <div class="modal-title-group">
          <span id="modal-day-badge" class="modal-badge"></span>
          <h2 id="modal-title" class="modal-title"></h2>
        </div>
        <button id="btn-close-modal" class="icon-btn icon-btn--ghost" type="button" aria-label="Chiudi" data-i18n-aria="close">
          <i data-lucide="x"></i>
        </button>
      </div>

      <!-- Tab bar when the day contains more than one file -->
      <div id="modal-file-tabs" class="media-tabs" hidden></div>

      <!-- Dynamic area managed by AdventMediaViewer -->
      <div id="modal-body" class="modal-body"></div>

      <div class="modal-footer">
        <button id="btn-comment" class="pill-btn pill-btn--soft" type="button">
          <i data-lucide="message-square-heart"></i>
          <span id="btn-comment-label">Commento</span>
          <span id="comment-dot" class="comment-dot" hidden></span>
        </button>

        <button id="btn-download-media" class="pill-btn pill-btn--primary" type="button" hidden>
          <i data-lucide="download"></i>
          <span id="btn-download-label">Scarica</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Toast notifications -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Install banner for Android / Desktop -->
  <aside id="pwa-install-banner" class="pwa-banner" hidden role="region" aria-label="Install">
    <div class="pwa-banner__text">
      <strong id="pwa-install-title">Installa l'app</strong>
      <span id="pwa-install-desc">Accesso rapido e funzionamento offline.</span>
    </div>
    <div class="pwa-banner__actions">
      <button id="pwa-install-btn" type="button" class="pwa-btn pwa-btn--primary">Installa</button>
      <button id="pwa-dismiss-btn" type="button" class="pwa-btn pwa-btn--ghost" aria-label="Chiudi" data-i18n-aria="close">✕</button>
    </div>
  </aside>

  <!-- Quick install guide banner for iOS (Safari) -->
  <aside id="ios-install-banner" class="pwa-banner pwa-banner--ios" hidden role="region" aria-label="iOS">
    <div class="pwa-banner__text">
      <strong id="ios-install-title">Installa su iPhone / iPad</strong>
      <span id="ios-install-desc">Tocca Condividi → Aggiungi alla schermata Home.</span>
    </div>
    <button id="ios-dismiss-btn" type="button" class="pwa-btn pwa-btn--ghost" aria-label="Chiudi" data-i18n-aria="close">✕</button>
  </aside>

  <!-- New version available banner -->
  <aside id="pwa-update-banner" class="pwa-banner pwa-banner--update" hidden role="status">
    <div class="pwa-banner__text">
      <strong id="pwa-update-title">Aggiornamento pronto</strong>
      <span id="pwa-update-desc">È disponibile una nuova versione dell'app.</span>
    </div>
    <button id="pwa-update-btn" type="button" class="pwa-btn pwa-btn--primary">Aggiorna</button>
  </aside>

  <!-- Application modules -->
  <script src="js/libs.js" defer></script>
  <script src="js/i18n.js" defer></script>
  <script src="js/time-storage.js" defer></script>
  <script src="js/media-viewer.js" defer></script>
  <script src="js/pwa-install.js" defer></script>
  <script src="js/app.js" defer></script>

</body>
</html>
