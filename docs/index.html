<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#fff5f7" />
  <title>Calendario dell'Avvento</title>

  <!-- =========================================================
       LIBRERIE ESTERNE (pronte per download offline in /libs/)
       ========================================================= -->

  <!-- 1. Font moderni e arrotondati: Fredoka (titoli/numeri) + Nunito (testi) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <!-- 2. Icone vettoriali arrotondate (Lucide Icons) -->
  <!-- Offline: ./libs/lucide.min.js -->
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js" defer></script>

  <!-- 3. Coriandoli all'apertura (Canvas Confetti) -->
  <!-- Offline: ./libs/confetti.browser.min.js -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js" defer></script>

  <!-- 4. Lettore Markdown + Sanitizzazione HTML (Marked + DOMPurify) -->
  <!-- Offline: ./libs/marked.min.js e ./libs/purify.min.js -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js" defer></script>

  <!-- 5. Lettore documenti Word .docx (Mammoth.js) -->
  <!-- Offline: ./libs/mammoth.browser.min.js -->
  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js" defer></script>

  <!-- 6. Lettore PDF su Canvas senza toolbar download (PDF.js UMD) -->
  <!-- Offline: ./libs/pdf.min.js (e ./libs/pdf.worker.min.js configurato in media-viewer.js) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>

  <!-- 7. Fallback decoder WASM per vocali .opus su browser che non li leggono nativamente (es. Safari/iOS) -->
  <!-- Offline: ./libs/ogg-opus-decoder.min.js -->
  <script src="https://cdn.jsdelivr.net/npm/ogg-opus-decoder@1.7.0/dist/ogg-opus-decoder.min.js" defer></script>

  <!-- Stili dell'applicazione -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Sfondo neve animata -->
  <canvas id="snow-canvas" aria-hidden="true"></canvas>

  <!-- Barra degli strumenti flottante -->
  <header class="toolbar-wrapper">
    <nav class="toolbar" aria-label="Barra degli strumenti">
      <div class="toolbar-brand">
        <div class="brand-badge" aria-hidden="true">
          <i data-lucide="gift"></i>
        </div>
        <div class="brand-text">
          <span id="toolbar-title" class="brand-title">Calendario</span>
          <span id="date-pill" class="date-pill" title="">
            <span id="time-source-dot" class="status-dot" aria-hidden="true"></span>
            <span id="date-pill-text">...</span>
          </span>
        </div>
      </div>

      <div class="toolbar-actions">
        <!-- Toggle Neve -->
        <button id="btn-snow" class="icon-btn" type="button" title="Attiva o disattiva neve" aria-label="Attiva o disattiva neve">
          <i data-lucide="snowflake"></i>
        </button>

        <!-- Selettore Lingua con menu a tendina -->
        <div class="lang-picker">
          <button
            id="btn-lang"
            class="icon-btn"
            type="button"
            aria-haspopup="menu"
            aria-expanded="false"
            aria-controls="lang-menu"
          >
            <i data-lucide="globe"></i>
            <span id="lang-code-label" class="btn-label-sm">IT</span>
          </button>

          <div id="lang-menu" class="lang-menu" role="menu" hidden></div>
        </div>

        <!-- Installazione PWA (Iterazione 4) -->
        <button id="btn-install" class="icon-btn icon-btn--accent" type="button">
          <i data-lucide="download"></i>
          <span id="btn-install-label" class="btn-label-desktop">Installa</span>
        </button>
      </div>
    </nav>
  </header>

  <!-- Contenuto principale -->
  <main class="container">
    <section class="hero">
      <div class="hero-pill">
        <i data-lucide="sparkles"></i>
        <span id="progress-text">0 / 24</span>
      </div>
      <h1 id="hero-title" class="hero-title">Calendario</h1>
      <p id="hero-subtitle" class="hero-subtitle"></p>

      <!-- Banner visibile automaticamente fuori dal mese target -->
      <div id="off-month-banner" class="info-banner" hidden>
        <i data-lucide="calendar-clock"></i>
        <span id="off-month-text"></span>
      </div>

      <!-- Barra Demo per testare date, mesi e riapertura multi-anno -->
      <div id="demo-controls" class="demo-bar" hidden>
        <span id="demo-tag-label" class="demo-tag">Anteprima Dev</span>

        <label class="demo-field">
          <span id="demo-year-label">Anno</span>
          <select id="demo-year-select">
            <option value="2025">2025</option>
            <option value="2026" selected>2026</option>
            <option value="2027">2027</option>
            <option value="2028">2028</option>
          </select>
        </label>

        <label class="demo-field">
          <span id="demo-month-label">Mese</span>
          <select id="demo-month-select">
            <option value="11">11</option>
            <option value="12" selected>12</option>
            <option value="1">1</option>
          </select>
        </label>

        <label class="demo-field" for="demo-day-slider">
          <span id="demo-day-label">Giorno</span>: <strong id="demo-day-value">5</strong>
          <input id="demo-day-slider" type="range" min="1" max="25" value="5" />
        </label>

        <button id="btn-reset-demo" class="mini-btn" type="button">
          <i data-lucide="rotate-ccw"></i>
          <span id="demo-reset-label">Reset</span>
        </button>
      </div>
    </section>

    <!-- Griglia 3D delle caselle -->
    <section id="calendar-grid" class="calendar-grid" aria-label="Caselle del calendario"></section>
  </main>

  <!-- Modale di visualizzazione contenuto -->
  <div id="day-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <div class="modal-card modal-card--wide">
      <div class="modal-header">
        <div class="modal-title-group">
          <span id="modal-day-badge" class="modal-badge"></span>
          <h2 id="modal-title" class="modal-title"></h2>
        </div>
        <button id="btn-close-modal" class="icon-btn icon-btn--ghost" type="button" aria-label="Chiudi">
          <i data-lucide="x"></i>
        </button>
      </div>

      <!-- Barra di selezione se il giorno contiene più file -->
      <div id="modal-file-tabs" class="media-tabs" hidden></div>

      <!-- Area dinamica gestita da AdventMediaViewer -->
      <div id="modal-body" class="modal-body"></div>

      <div class="modal-footer">
        <button id="btn-comment" class="pill-btn pill-btn--soft" type="button">
          <i data-lucide="message-square-heart"></i>
          <span id="btn-comment-label">Commento</span>
          <span id="comment-dot" class="comment-dot" hidden></span>
        </button>

        <button id="btn-download-media" class="pill-btn pill-btn--primary" type="button" hidden>
          <i data-lucide="download"></i>
          <span id="btn-download-label">Scarica</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Toast notifiche -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Moduli applicazione -->
  <script src="js/i18n.js" defer></script>
  <script src="js/time-storage.js" defer></script>
  <script src="js/media-viewer.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
